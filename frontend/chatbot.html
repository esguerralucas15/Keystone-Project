<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot - EquiFinance</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Sora:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --bg: #f7f9fc;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-2: #f3f6fb;
      --border: rgba(16, 24, 40, 0.12);
      --text: #0f172a;
      --muted: #5a6b82;
      --accent: #0ea5e9;
      --accent-2: #14b8a6;
      --user: #e0f2fe;
      --assistant: #ffffff;
      --system: #f1f5fb;
      --shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Manrope', sans-serif;
      background:
        radial-gradient(800px 420px at 8% 0%, rgba(14, 165, 233, 0.18), transparent 60%),
        radial-gradient(700px 420px at 92% 10%, rgba(20, 184, 166, 0.18), transparent 60%),
        linear-gradient(180deg, #f7f9fc, #e9eef6);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 20px 40px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(15, 23, 42, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 23, 42, 0.05) 1px, transparent 1px);
      background-size: 90px 90px;
      pointer-events: none;
      z-index: 0;
    }

    .topbar {
      max-width: 1100px;
      margin: 0 auto 24px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 1;
    }

    .topbar-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
    }

    .topbar-mark {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #04111b;
      font-size: 13px;
    }

    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 13px;
    }

    .topbar-nav a {
      text-decoration: none;
      color: var(--muted);
      font-weight: 600;
    }

    .topbar-nav a:hover {
      color: var(--text);
    }

    .topbar-cta {
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      color: #04111b;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 12px 22px rgba(14, 165, 233, 0.2);
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 16px;
    }

    .sidebar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      height: 560px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      animation: floatIn 0.5s ease;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      font-family: 'Sora', sans-serif;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .chat-item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .chat-item:hover {
      border-color: rgba(14, 165, 233, 0.5);
      transform: translateY(-1px);
      box-shadow: 0 12px 20px rgba(15, 23, 42, 0.08);
    }

    .chat-item.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(14, 165, 233, 0.2);
    }

    .chat-item .meta {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .sidebar-footer {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    h2 {
      font-size: 26px;
      font-weight: 700;
      font-family: 'Sora', sans-serif;
      letter-spacing: -0.02em;
    }

    .back-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #04111b;
      padding: 8px 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 22px rgba(14, 165, 233, 0.2);
    }

    .back-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 28px rgba(14, 165, 233, 0.25);
    }

    #chat {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: 560px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      animation: floatIn 0.5s ease;
    }

    .user-info {
      background: var(--panel-2);
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 14px;
      border: 1px solid var(--border);
    }

    .history-status { color: var(--muted); }

    #messages {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex: 1;
      margin-bottom: 12px;
      padding-right: 6px;
    }

    .msg {
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 12px;
      max-width: 78%;
      word-wrap: break-word;
      line-height: 1.5;
      border: 1px solid transparent;
      animation: messageIn 0.2s ease;
    }

    .user {
      background: var(--user);
      align-self: flex-end;
      border-color: rgba(14, 165, 233, 0.2);
    }

    .bot {
      background: var(--assistant);
      align-self: flex-start;
      border-color: rgba(15, 23, 42, 0.08);
    }

    .system {
      background: var(--system);
      align-self: center;
      border-color: rgba(15, 23, 42, 0.08);
      color: var(--muted);
      font-size: 13px;
    }

    #controls {
      display: flex;
      gap: 10px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    textarea {
      flex: 1;
      height: 70px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font-family: 'Manrope', sans-serif;
      resize: none;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.18);
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #04111b;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 22px rgba(14, 165, 233, 0.2);
    }

    button:hover { transform: translateY(-1px); box-shadow: 0 18px 28px rgba(14, 165, 233, 0.22); }
    button:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; box-shadow: none; }
    button.secondary { background: rgba(15, 23, 42, 0.06); color: var(--text); border: 1px solid var(--border); box-shadow: none; }
    button.secondary:hover { box-shadow: 0 12px 20px rgba(15, 23, 42, 0.08); }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .sidebar {
        height: auto;
      }
      #chat {
        height: 70vh;
      }
    }

    @media (max-width: 720px) {
      .msg { max-width: 90%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <div class="topbar-mark">EF</div>
      <div>EquiFinance</div>
    </div>
    <nav class="topbar-nav">
      <a href="/static/dashboard.html">Dashboard</a>
      <a href="/static/savings.html">Metas</a>
      <a href="/static/simulator.html">Simulador</a>
      <a href="/static/chatbot.html">Asesor</a>
    </nav>
    <a class="topbar-cta" href="/static/savings.html">Ver metas</a>
  </header>

  <div class="app">
    <div class="header">
      <h2>Asesor Financiero EquiFinance</h2>
      <button class="back-btn" onclick="window.location.href='/static/dashboard.html'">← Volver</button>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title">Chats</div>
          <button id="new-session" class="secondary">Nuevo chat</button>
        </div>
        <div id="chat-list" class="chat-list"></div>
        <div class="sidebar-footer" id="history-status"></div>
      </aside>

      <div id="chat">
        <div class="user-info">
          👤 Usuario: <strong id="user-name"></strong> | 📧 <span id="user-email"></span>
        </div>
        <div id="messages"></div>
        <div id="controls">
          <textarea id="message" placeholder="Escribe tu pregunta financiera..."></textarea>
          <button id="send">Enviar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 🔐 usuario del localStorage
    let user = null;
    try {
      const rawUser = localStorage.getItem("user");
      user = rawUser ? JSON.parse(rawUser) : null;
    } catch (e) {
      user = null;
    }

    const messagesEl = document.getElementById('messages');
    const chatListEl = document.getElementById('chat-list');
    const historyStatus = document.getElementById('history-status');
    const HISTORY_LIMIT = 40;
    const ACTIVE_SESSION_KEY = user ? `chatbot_active_session_${user.id}` : 'chatbot_active_session';
    const VISIT_KEY = user ? `chatbot_visited_${user.id}` : 'chatbot_visited';
    let sessionsCache = [];
    
    // 🚨 si no hay usuario → login
    if (!user || !user.id) {
      localStorage.removeItem("user");
      window.location.href = "/static/index.html";
    }
    
    // 👤 mostrar usuario
    if (user) {
      document.getElementById("user-name").innerText = user.name || "Invitado";
      document.getElementById("user-email").innerText = user.email || "";
    }
    function resetSessionAndRedirect() {
      localStorage.removeItem("user");
      localStorage.removeItem(ACTIVE_SESSION_KEY);
      localStorage.removeItem(VISIT_KEY);
      window.location.href = "/static/index.html";
    }

    function clearActiveSession() {
      localStorage.removeItem(ACTIVE_SESSION_KEY);
    }

    async function parseJsonSafe(res) {
      try {
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    function handleApiError(res, data) {
      if (res && res.status === 404 && data && data.detail === "Usuario no encontrado") {
        addSystemMessage("Tu sesión expiró. Inicia sesión de nuevo.");
        setTimeout(() => resetSessionAndRedirect(), 800);
        return true;
      }
      return false;
    }

    function addMessage(text, role, options = {}){
      const d = document.createElement('div');
      const isUser = role === 'user';
      const isAssistant = role === 'assistant';
      const isSystem = role === 'system';
      const prefix = options.prefix ?? (isUser || isAssistant);
      const label = prefix ? (isUser ? 'Tú: ' : '🤖 Asesor: ') : '';
      d.className = 'msg ' + (isSystem ? 'system' : (isUser ? 'user' : 'bot'));
      d.textContent = label + text;
      messagesEl.appendChild(d);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addSystemMessage(text) {
      addMessage(text, 'system', { prefix: false });
    }

    function clearMessages() {
      messagesEl.innerHTML = '';
    }

    function getActiveSessionId() {
      return localStorage.getItem(ACTIVE_SESSION_KEY);
    }

    function setActiveSessionId(sessionId) {
      if (sessionId) {
        localStorage.setItem(ACTIVE_SESSION_KEY, sessionId.toString());
      }
    }

    async function createSession() {
      const res = await fetch('/chatbot/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: user.id })
      });
      const data = await parseJsonSafe(res);
      if (handleApiError(res, data)) {
        throw new Error('Usuario no encontrado');
      }
      if (!res.ok) {
        throw new Error((data && data.detail) || 'No se pudo crear el chat');
      }
      return data.session;
    }

    function renderChatList(activeSessionId) {
      chatListEl.innerHTML = '';

      if (!sessionsCache.length) {
        historyStatus.textContent = 'Sin chats todavía';
        return;
      }

      sessionsCache.forEach((session) => {
        const item = document.createElement('div');
        const titulo = session.title || `Chat ${session.id}`;
        const total = session.message_count || 0;
        const meta = session.last_message_at
          ? new Date(session.last_message_at).toLocaleString('es-CO')
          : 'Sin mensajes';

        const activeId = activeSessionId ? Number(activeSessionId) : null;
        item.className = 'chat-item' + (activeId === session.id ? ' active' : '');
        item.dataset.sessionId = session.id;
        item.innerHTML = `
          <div>${titulo}</div>
          <div class="meta">${total} mensajes · ${meta}</div>
        `;
        item.addEventListener('click', () => {
          const nextId = Number(session.id);
          setActiveSessionId(nextId);
          renderChatList(nextId);
          loadHistory({ sessionId: nextId });
        });

        chatListEl.appendChild(item);
      });

      historyStatus.textContent = `Chats: ${sessionsCache.length}`;
    }

    async function fetchSessions({ selectSessionId = null } = {}) {
      if (!user) return;
      try {
        const res = await fetch(`/chatbot/sessions?user_id=${user.id}`);
        const data = await parseJsonSafe(res);
        if (handleApiError(res, data)) {
          return;
        }
        if (!res.ok) {
          throw new Error((data && data.detail) || 'No se pudo cargar el historial');
        }
        sessionsCache = data.sessions || [];
        if (selectSessionId) {
          setActiveSessionId(selectSessionId);
        }
        renderChatList(selectSessionId || getActiveSessionId());
      } catch (e) {
        console.error(e);
        historyStatus.textContent = 'No se pudo cargar el historial';
        addSystemMessage('❌ No se pudieron cargar los chats');
      }
    }

    async function loadHistory({ sessionId = null, limit = HISTORY_LIMIT, showEmptyMessage = true } = {}) {
      if (!user) return;
      try {
        clearMessages();
        const params = new URLSearchParams({
          user_id: user.id.toString(),
          limit: limit.toString(),
        });
        if (sessionId) {
          params.append('session_id', Number(sessionId).toString());
        }

        const res = await fetch(`/chatbot/history?${params.toString()}`);
        const data = await parseJsonSafe(res);
        if (handleApiError(res, data)) {
          return 0;
        }
        if (res && res.status === 404 && data && data.detail === "Sesion no encontrada") {
          clearActiveSession();
          const session = await createSession();
          setActiveSessionId(session.id);
          await fetchSessions({ selectSessionId: session.id });
          clearMessages();
          await loadInitialRecommendation({ force: true, sessionId: session.id });
          return 0;
        }
        if (!res.ok) {
          throw new Error((data && data.detail) || 'No se pudo cargar el chat');
        }
        const mensajes = data.messages || [];
        if (data.session_id) {
          setActiveSessionId(data.session_id);
          renderChatList(data.session_id);
        }

        if (mensajes.length === 0) {
          if (showEmptyMessage) {
            addSystemMessage('No hay mensajes guardados todavía.');
          }
          return 0;
        }

        mensajes.forEach((msg) => addMessage(msg.content, msg.role));
        return mensajes.length;
      } catch (e) {
        console.error(e);
        addSystemMessage('❌ Error al cargar el historial');
        return 0;
      }
    }

    // 🎯 Cargar recomendación inicial si es la primera vez
    async function loadInitialRecommendation({ force = false, sessionId = null } = {}) {
      const hasVisited = localStorage.getItem(VISIT_KEY);
      
      if (!hasVisited || force) {
        addSystemMessage('👋 Generando tu recomendación inicial...');
        
        try {
          const res = await fetch('/chatbot/initial-recommendation', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: user.id, session_id: sessionId })
          });
          
          const data = await parseJsonSafe(res);
          if (handleApiError(res, data)) {
            return;
          }
          
          if (res.ok) {
            addMessage(
              data.recommendation || 'Disculpa, no se pudo generar la recomendación',
              'assistant'
            );
            if (data.follow_up) {
              addMessage(data.follow_up, 'assistant');
            }
            localStorage.setItem(VISIT_KEY, 'true');
            if (data.session_id) {
              setActiveSessionId(data.session_id);
              renderChatList(data.session_id);
            }
          } else {
            addSystemMessage('⚠️ ' + (data.detail || 'No se pudo cargar la recomendación'));
          }
        } catch (e) {
          console.error(e);
          addSystemMessage('❌ Error al cargar la recomendación inicial');
        }
      }

      fetchSessions({ selectSessionId: sessionId });
    }

    document.getElementById('new-session').addEventListener('click', async () => {
      try {
        const session = await createSession();
        setActiveSessionId(session.id);
        await fetchSessions({ selectSessionId: session.id });
        clearMessages();

        if (!localStorage.getItem(VISIT_KEY)) {
          await loadInitialRecommendation({ force: true, sessionId: session.id });
        } else {
          addMessage('Listo, dime en qué tema financiero te puedo ayudar hoy.', 'assistant');
        }
      } catch (e) {
        console.error(e);
        addSystemMessage('❌ No se pudo crear un nuevo chat');
      }
    });

    document.getElementById('send').addEventListener('click', async ()=>{
      const sendBtn = document.getElementById('send');
      const prevText = sendBtn.textContent;
      sendBtn.disabled = true;
      sendBtn.textContent = 'Enviando...';
      const user_id = user.id;
      let sessionId = getActiveSessionId();
      if (!sessionId) {
        try {
          const session = await createSession();
          sessionId = session.id;
          setActiveSessionId(sessionId);
          await fetchSessions({ selectSessionId: sessionId });
        } catch (e) {
          console.error(e);
          addSystemMessage('❌ No se pudo iniciar el chat');
          sendBtn.disabled = false;
          sendBtn.textContent = prevText;
          return;
        }
      }
      const message = document.getElementById('message').value.trim();
      
      if(!message){ 
        addSystemMessage('Por favor escribe un mensaje');
        sendBtn.disabled = false;
        sendBtn.textContent = prevText;
        return; 
      }
      
      addMessage(message, 'user');
      document.getElementById('message').value = '';

      try{
        const res = await fetch('/chatbot/message', {
          method: 'POST', 
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ user_id, session_id: Number(sessionId), message })
        });
        
        let data;
        try { 
          data = await res.json(); 
        } catch(e){ 
          data = { reply: 'Error: Respuesta inválida del servidor' }; 
        }

        if (handleApiError(res, data)) {
          return;
        }
        
        if(res.ok){
          addMessage(data.reply || 'No se generó respuesta', 'assistant');
        } else {
          const errMsg = data?.detail || data?.reply || 'Error desconocido';
          addSystemMessage('❌ Error: ' + errMsg);
        }
      }catch(e){
        console.error(e); 
        addSystemMessage('❌ Error al contactar al servidor: ' + e.message);
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = prevText;
        fetchSessions();
      }
    });
    
    // Enviar al presionar Enter
    document.getElementById('message').addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('send').click();
      }
    });

    async function initChat() {
      await fetchSessions();

      let activeSessionId = getActiveSessionId();
      const ids = sessionsCache.map((session) => session.id);
      if (activeSessionId && !ids.includes(Number(activeSessionId))) {
        clearActiveSession();
        activeSessionId = null;
      }

      if (!activeSessionId && sessionsCache.length) {
        activeSessionId = sessionsCache[0].id;
        setActiveSessionId(activeSessionId);
        renderChatList(activeSessionId);
      }

      if (!activeSessionId) {
        const session = await createSession();
        activeSessionId = session.id;
        setActiveSessionId(activeSessionId);
        await fetchSessions({ selectSessionId: activeSessionId });
      }

      const historyCount = await loadHistory({
        sessionId: activeSessionId,
        showEmptyMessage: false,
      });

      if (!historyCount) {
        await loadInitialRecommendation({ force: true, sessionId: activeSessionId });
      } else {
        renderChatList(activeSessionId);
      }
    }

    initChat();
  </script>
</body>
</html>
